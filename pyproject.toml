[project]
name = "pac"
version = "0.1.0"
description = "LLM-prompted policy alignment classifier for AI agent trace events"
authors = [
    { email = "abdelrahman.sehaily@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pac = "pac.interfaces.cli:app"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ASYNC240"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "data", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: exercises several components together (still offline)",
    "live: calls a real LLM backend; skipped unless PAC_LIVE_TESTS=1",
]

# Architecture fitness functions: `uv run lint-imports` (also run in CI).
[tool.importlinter]
root_package = "pac"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Outer layers depend on inner ones, never the reverse"
type = "layers"
layers = [
    "pac.interfaces",
    "pac.bootstrap",
    "pac.evaluation | pac.simulation",
    "pac.guardrail",
]

[[tool.importlinter.contracts]]
name = "Guardrail context is layered: infrastructure > application > domain"
type = "layers"
layers = [
    "pac.guardrail.infrastructure",
    "pac.guardrail.application",
    "pac.guardrail.domain",
]

[[tool.importlinter.contracts]]
name = "Evaluation context is layered: infrastructure > application > domain"
type = "layers"
layers = [
    "pac.evaluation.infrastructure",
    "pac.evaluation.application",
    "pac.evaluation.domain",
]

[[tool.importlinter.contracts]]
name = "Simulation context is layered: application > domain"
type = "layers"
layers = [
    "pac.simulation.application",
    "pac.simulation.domain",
]

[[tool.importlinter.contracts]]
name = "Simulation sees the guardrail's domain model and LLM port, never the classifier"
type = "forbidden"
source_modules = ["pac.simulation"]
forbidden_modules = [
    "pac.guardrail.infrastructure",
    "pac.guardrail.application.llm_classifier",
    "pac.guardrail.application.prompting",
]

[[tool.importlinter.contracts]]
name = "Evaluation sees only the guardrail's published domain model"
type = "forbidden"
source_modules = ["pac.evaluation"]
forbidden_modules = ["pac.guardrail.application", "pac.guardrail.infrastructure"]

[[tool.importlinter.contracts]]
name = "Domain and application code stay free of I/O frameworks and configuration"
type = "forbidden"
source_modules = [
    "pac.guardrail.domain",
    "pac.guardrail.application",
    "pac.evaluation.domain",
    "pac.evaluation.application",
    "pac.simulation.domain",
    "pac.simulation.application",
]
forbidden_modules = ["anthropic", "httpx", "fastapi", "typer", "uvicorn", "pac.settings"]
